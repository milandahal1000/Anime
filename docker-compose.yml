services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env.production
    volumes:
      - sqlite_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  sqlite_data:
